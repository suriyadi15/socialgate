name: Docker

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/${{ github.repository }}

jobs:
    image:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-qemu-action@v4

            - uses: docker/setup-buildx-action@v4

            - name: Build for the smoke test
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64
                  load: true
                  tags: socialgate:smoke
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke test
              run: |
                  docker run -d --name smoke -e ACCESS_KEY=ci-key -p 3000:3000 socialgate:smoke
                  for i in $(seq 1 20); do
                      curl -fs http://127.0.0.1:3000/healthz && break
                      sleep 1
                  done
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz)" = 200
                  test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/youtube/user/@Google)" = 401
                  docker rm -f smoke

            - uses: docker/login-action@v4
              if: github.event_name != 'pull_request'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
